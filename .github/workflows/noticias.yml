name: Orbit noticias
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Forcar teste (envia aviso de teste)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: orbit-noticias
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler noticias e avisar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.forcar && '1' || '' }}
        run: node noticias.mjs
      - name: Salvar lista
        if: always()
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "orbit-bot"
            git config user.email "orbit-bot@users.noreply.github.com"
            git add news.json
            git commit -m "noticias"
            git pull --rebase || true
            git push
          fi
